<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Story by Strangers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>A Story by Strangers</h1>

    <p class="instructions">
      Read the story so far, then add ONE word.<br>
      Shake your phone to get word suggestions.
    </p>

    <section id="story" class="story">Once</section>

    <form id="storyForm">
      <input
        id="wordInput"
        type="text"
        placeholder="Add one word..."
        autocomplete="off"
      >
      <button type="submit">ADD</button>
    </form>

    <p id="message" class="message"></p>

    <section class="suggestions-area">
      <h2>Word suggestions</h2>
      <p id="shakeMessage">Shake your phone to get ideas.</p>
      <div id="suggestions" class="suggestions"></div>
    </section>

    <button id="resetButton" class="reset">Start a new story</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
