<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Story by Strangers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <p class="small-title">A STORY BY STRANGERS</p>

        <h1>One word at a time.</h1>

        <p class="instructions">
            Read the story so far, then add one word.
        </p>

        <section class="story-box">
            <p id="story">Once</p>
        </section>

        <section class="input-area">
            <label for="wordInput">Add one word</label>

            <div class="input-row">
                <input
                    type="text"
                    id="wordInput"
                    placeholder="your word"
                    autocomplete="off"
                    maxlength="30"
                >
                <button id="addButton">ADD</button>
            </div>

            <p id="message"></p>
        </section>

        <button id="resetButton" class="reset-button">
            Start a new story
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
